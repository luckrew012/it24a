 <h1>Campus Map</h1>
 <div id="map"></div>

</body>
<script>
    

function initMap(mapDataUrl){
   const map = L.map('map').setView([8.8603, 124.8684], 17)
    //OpenStreetMapLayer
   const openStreetMap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution: '&copy; OpenStreetMap contributors'
   });
   //Satwllite
   const satellite = L.tileLayer(
   'https://server.arcgisonline.comm/ArcGis/rest/services/World_Imagery/MapServer/tile/{z}/{x}/{y}',
   {attribution:'Tiles (c) Esri - Source: Esri, Maxar, Earthstar Geographics, GIS User Community '}

   );
   openStreetMap.addTo(map);
   console.log("Base map tile layer loaded" + Date());
}

document.addEventListener("DOMContentLoaded", ()=>{
    initMap('')

})
</script>
