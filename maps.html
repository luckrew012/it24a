<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>
     
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    
     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

<style>

    #map { height: 400px; }
    .popup-image {
  max-width: 200px;
  height: auto;
  border-radius: 10px;
}
</style>
</head>
<body>
   
 <h1>Basic Map</h1>
 <div id="map"></div>

</body>
<script>
    var map = L.map('map').setView([8.36972, 124.86444], 15);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

var marker = L.marker([8.36972, 124.86444]).addTo(map);

const catImage = '<img src="https://placekitten.com/300/200" class="popup-image" alt="Cute cat">';
const popupContent = `${catImage}<br><b>Hello world!</b><br>I am a pop up.`;

marker.bindPopup(popupContent).openPopup();
</script>
</html>
